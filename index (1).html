<style>
:root{--gold:#e0bd7a;--ink:rgba(8,11,22,.55);--line:rgba(224,189,122,.38)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#04060d;color:#f3ead9;
  font-family:'Tajawal',system-ui,-apple-system,'Segoe UI',sans-serif;
  -webkit-user-select:none;user-select:none;touch-action:none;overscroll-behavior:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
#hud>*{transition:opacity .45s ease}
.btn{font:500 15px 'Tajawal',system-ui,sans-serif;color:#f6ecd8;background:var(--ink);
  border:1px solid var(--line);border-radius:999px;padding:11px 18px;cursor:pointer;
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);letter-spacing:.2px;white-space:nowrap}
.btn:active{transform:scale(.97)}
.btn.on{background:rgba(224,189,122,.9);color:#1a1408;border-color:transparent}
#topbar{position:fixed;top:calc(12px + env(safe-area-inset-top));left:calc(12px + env(safe-area-inset-left));
  right:calc(12px + env(safe-area-inset-right));display:flex;gap:8px;justify-content:space-between;z-index:5}
#topbar{gap:6px}#topbar .btn{padding:10px 12px;font-size:14px}
#place{position:fixed;top:calc(70px + env(safe-area-inset-top));left:0;right:0;text-align:center;
  font:500 15px 'El Messiri','Tajawal',sans-serif;color:var(--gold);letter-spacing:1px;
  text-shadow:0 1px 12px #000;pointer-events:none;z-index:4}
#floor{position:fixed;top:calc(108px + env(safe-area-inset-top));left:0;right:0;text-align:center;pointer-events:none;
  opacity:0;z-index:4;text-shadow:0 2px 26px rgba(0,0,0,.9)}
#floor.show{opacity:1}
#floorNum{display:block;font:700 76px/1 'El Messiri','Tajawal',sans-serif;color:#fff3d6;direction:ltr;
  font-variant-numeric:tabular-nums}
#floor small{display:block;margin-top:4px;font-size:15px;color:var(--gold);letter-spacing:2px}
#btnAct{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(150px + env(safe-area-inset-bottom));
  display:none;z-index:6;font-size:16px;padding:14px 24px;border-color:var(--gold);
  box-shadow:0 0 28px rgba(224,189,122,.35)}
#btnAct.show{display:block}
#hint{position:fixed;left:0;right:0;bottom:calc(14px + env(safe-area-inset-bottom));text-align:center;
  font-size:13px;color:rgba(243,234,217,.7);pointer-events:none;padding:0 16px;text-shadow:0 1px 8px #000;z-index:4}
#joy{position:fixed;left:calc(22px + env(safe-area-inset-left));bottom:calc(44px + env(safe-area-inset-bottom));
  width:124px;height:124px;border-radius:50%;border:1px solid var(--line);background:rgba(8,11,22,.32);
  -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);display:none;z-index:6;touch-action:none}
#knob{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#f6dfae,#b98f45);box-shadow:0 2px 14px rgba(0,0,0,.5)}
body.touch #joy{display:block}
body.touch #hint{bottom:calc(8px + env(safe-area-inset-bottom));font-size:12px}
body.clean #hud>*,body.pre #hud>*{opacity:0!important;pointer-events:none}
body.clean #joy{pointer-events:auto}
body.tour #joy,body.tour #btnAct,body.tour #hint{opacity:0;pointer-events:none}
#toast{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);background:rgba(6,8,16,.78);
  border:1px solid var(--line);border-radius:14px;padding:12px 18px;font-size:14px;opacity:0;
  transition:opacity .5s;pointer-events:none;z-index:8;text-align:center;max-width:82vw}
#toast.show{opacity:1}
#fade{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .6s;z-index:7}
#fade.on{opacity:1}
#intro{position:fixed;inset:0;z-index:9;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;
  padding:24px 24px calc(64px + env(safe-area-inset-bottom));text-align:center;
  background:linear-gradient(180deg,rgba(4,6,13,.15) 0%,rgba(4,6,13,0) 35%,rgba(4,6,13,.82) 78%,rgba(4,6,13,.95) 100%);
  transition:opacity .8s}
#intro.gone{opacity:0;pointer-events:none}
#intro h1{margin:0;font:700 clamp(44px,13vw,84px)/1.05 'El Messiri','Tajawal',serif;color:#fbf1dc;
  text-shadow:0 4px 40px rgba(0,0,0,.8)}
#intro .sub{margin:10px 0 26px;font-size:16px;letter-spacing:3px;color:var(--gold)}
#intro .row{display:flex;flex-direction:column;gap:10px;width:min(320px,100%)}
#intro .btn{font-size:17px;padding:15px 20px}
#intro .tip{margin-top:18px;font-size:13px;color:rgba(243,234,217,.62);line-height:1.8}
#err{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:30px;text-align:center;
  z-index:20;background:#04060d;font-size:16px;line-height:1.9}
</style>

<div id="hud">

<div id="err">تعذّر تشغيل العرض ثلاثي الأبعاد على هذا المتصفح.<br>جرّب متصفحاً أحدث يدعم WebGL.</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
'use strict';
const $=id=>document.getElementById(id);
if(!window.THREE){$('err').style.display='flex';return;}
const T=THREE,V3=T.Vector3,PI=Math.PI,TAU=PI*2;
const isTouch=(window.matchMedia&&matchMedia('(pointer:coarse)').matches)||('ontouchstart' in window);
if(isTouch)document.body.classList.add('touch');
const canvas=$('c');
let renderer;
try{renderer=new T.WebGLRenderer({canvas,antialias:!isTouch||(window.devicePixelRatio||1)<2,powerPreference:'high-performance'});}
catch(e){$('err').style.display='flex';return;}
let PR=Math.min(window.devicePixelRatio||1,isTouch?1.75:2);
renderer.setPixelRatio(PR);
renderer.outputEncoding=T.sRGBEncoding;
renderer.toneMapping=T.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.2;

const scene=new T.Scene();
scene.background=new T.Color(0x04060d);
scene.fog=new T.FogExp2(0x0c1228,0.00019);
const camera=new T.PerspectiveCamera(70,1,0.25,15000);
camera.rotation.order='YXZ';

/* ---------- helpers ---------- */
function rng(seed){let a=seed>>>0;return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const R=rng(20261116);
const rr=(a,b)=>a+(b-a)*R();
function ctex(w,h,draw,rep){const c=document.createElement('canvas');c.width=w;c.height=h;const g=c.getContext('2d');draw(g,w,h);
  const t=new T.CanvasTexture(c);t.encoding=T.sRGBEncoding;t.anisotropy=Math.min(4,renderer.capabilities.getMaxAnisotropy());
  if(rep){t.wrapS=t.wrapT=T.RepeatWrapping;if(rep.length)t.repeat.set(rep[0],rep[1]);}return t;}
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const smoother=t=>{t=clamp(t,0,1);return t*t*t*(t*(t*6-15)+10);};
const glowTex=ctex(64,64,(g)=>{const gr=g.createRadialGradient(32,32,0,32,32,32);gr.addColorStop(0,'rgba(255,255,255,1)');gr.addColorStop(.22,'rgba(255,255,255,.55)');gr.addColorStop(.55,'rgba(255,255,255,.12)');gr.addColorStop(1,'rgba(255,255,255,0)');g.fillStyle=gr;g.fillRect(0,0,64,64);});
function points(arr,color,size,opts){const g=new T.BufferGeometry();g.setAttribute('position',new T.Float32BufferAttribute(arr,3));
  const o=Object.assign({map:glowTex,color,size,transparent:true,depthWrite:false,blending:T.AdditiveBlending,sizeAttenuation:true},opts||{});
  const p=new T.Points(g,new T.PointsMaterial(o));p.frustumCulled=false;return p;}
function mesh(geo,mat,x,y,z,parent){const m=new T.Mesh(geo,mat);m.position.set(x||0,y||0,z||0);(parent||scene).add(m);return m;}
function veins(g,w,h,n,col){g.strokeStyle=col;for(let i=0;i<n;i++){g.lineWidth=rr(.4,1.6);g.globalAlpha=rr(.15,.6);g.beginPath();let x=rr(0,w),y=rr(0,h);g.moveTo(x,y);for(let k=0;k<4;k++){x+=rr(-w*.3,w*.3);y+=rr(-h*.3,h*.3);g.lineTo(x,y);}g.stroke();}g.globalAlpha=1;}

const DECK_Y=555,EYE=1.7,FZ=78;
const LZ=252,LA=112,LB=72,kit={},cityIMs=[];
const lakeZone=(x,z)=>{const a=x/(LA+36),b=(z-LZ)/(LB+34);return a*a+b*b<1||(Math.abs(x)<26&&z>140&&z<LZ);};

/* ---------- sky ---------- */
(function(){
  const g=new T.SphereGeometry(11000,32,20);const p=g.attributes.position,col=[];
  const cH=new T.Color(0x2e2542),cM=new T.Color(0x101a3c),cZ=new T.Color(0x02040b),c=new T.Color();
  for(let i=0;i<p.count;i++){const t=p.getY(i)/11000;
    if(t<0)c.copy(cH).multiplyScalar(1+t*3>0?1+t*3:0);else if(t<.18)c.copy(cH).lerp(cM,t/.18);else c.copy(cM).lerp(cZ,Math.min(1,(t-.18)/.5));
    col.push(c.r,c.g,c.b);}
  g.setAttribute('color',new T.Float32BufferAttribute(col,3));
  const m=mesh(g,new T.MeshBasicMaterial({vertexColors:true,side:T.BackSide,fog:false,depthWrite:false}));m.renderOrder=-10;
  const st=[];for(let i=0;i<1500;i++){const a=R()*TAU,e=Math.asin(rr(.06,1)),r=9500;st.push(Math.cos(e)*Math.cos(a)*r,Math.sin(e)*r,Math.cos(e)*Math.sin(a)*r);}
  scene.add(points(st,0xdfe8ff,2.2,{sizeAttenuation:false,fog:false,opacity:.85}));
  const moon=new T.Sprite(new T.SpriteMaterial({map:glowTex,color:0xcfdcff,fog:false,transparent:true,depthWrite:false,blending:T.AdditiveBlending}));
  moon.position.set(-4200,4300,-6500);moon.scale.set(1500,1500,1);scene.add(moon);
  const disc=new T.Sprite(new T.SpriteMaterial({map:ctex(64,64,g=>{g.fillStyle='#f4f1e4';g.beginPath();g.arc(32,32,26,0,TAU);g.fill();g.globalAlpha=.12;g.fillStyle='#667';for(let i=0;i<9;i++){g.beginPath();g.arc(rr(14,50),rr(14,50),rr(3,8),0,TAU);g.fill();}}),fog:false,transparent:true,depthWrite:false}));
  disc.position.copy(moon.position);disc.scale.set(330,330,1);scene.add(disc);
})();

/* ---------- lights ---------- */
scene.add(new T.HemisphereLight(0x4a5a85,0x1c1510,0.95));
const moonL=new T.DirectionalLight(0x9db4e6,0.45);moonL.position.set(-4,6,-5);scene.add(moonL);
const fountainL=new T.PointLight(0x4fc8ff,1.6,75,2);fountainL.position.set(0,5,FZ);scene.add(fountainL);
const entryL=new T.PointLight(0xffc98a,1.5,48,2);entryL.position.set(0,5.5,51);scene.add(entryL);
const innerL=new T.PointLight(0xffdcae,1.15,60,2);innerL.position.set(0,6.4,30);scene.add(innerL);

/* ---------- TOWER ---------- */
const tower=new T.Group();scene.add(tower);
const uTime={value:0};
(function(){
  const TILE=12;
  const A={pos:[],uv:[],col:[]},B={pos:[],col:[]},glints=[];
  function prism(a,pts,y0,y1,cb,ct,cap,capCol){
    const n=pts.length;let cx=0,cz=0;for(const p of pts){cx+=p[0];cz+=p[1];}cx/=n;cz/=n;let per=0;
    for(let i=0;i<n;i++){const p=pts[i],q=pts[(i+1)%n],ex=q[0]-p[0],ez=q[1]-p[1],len=Math.hypot(ex,ez);
      const out=(-ez)*((p[0]+q[0])/2-cx)+ex*((p[1]+q[1])/2-cz)>0;
      const u0=per/TILE,u1=(per+len)/TILE,v0=y0/TILE,v1=y1/TILE;per+=len;
      const P0=[p[0],y0,p[1],u0,v0,cb],Q0=[q[0],y0,q[1],u1,v0,cb],Q1=[q[0],y1,q[1],u1,v1,ct],P1=[p[0],y1,p[1],u0,v1,ct];
      const tri=out?[P0,Q0,Q1,P0,Q1,P1]:[Q0,P0,P1,Q0,P1,Q1];
      for(const v of tri){a.pos.push(v[0],v[1],v[2]);if(a.uv)a.uv.push(v[3],v[4]);a.col.push(v[5][0],v[5][1],v[5][2]);}
    }
    if(cap){const cc=capCol||[.05,.055,.07];for(let i=0;i<n;i++){let p=pts[i],q=pts[(i+1)%n];
      if((p[1]-cz)*(q[0]-cx)-(p[0]-cx)*(q[1]-cz)<0){const t=p;p=q;q=t;}
      a.pos.push(cx,y1,cz,p[0],y1,p[1],q[0],y1,q[1]);if(a.uv)a.uv.push(.03,.03,.03,.03,.03,.03);for(let k=0;k<3;k++)a.col.push(cc[0],cc[1],cc[2]);}}
  }
  function wingPts(ang,r0,L,w){const dx=Math.sin(ang),dz=Math.cos(ang),px=dz,pz=-dx,P=(al,pe)=>[dx*al+px*pe,dz*al+pz*pe];
    const pts=[P(r0,w),P(r0,-w)];for(let s=0;s<=8;s++){const th=-PI/2+PI*s/8;pts.push(P(L-w+Math.cos(th)*w,Math.sin(th)*w));}return pts;}
  function ngon(r,n,rot){const p=[];for(let i=0;i<n;i++){const a=i/n*TAU+(rot||0);p.push([Math.sin(a)*r,Math.cos(a)*r]);}return p;}
  const cool=[.80,.90,1.08],warm=[1.1,.92,.66],bandC=[1.0,.9,.68],finC=[.55,.78,1.0];
  const mul=(c,k)=>[c[0]*k,c[1]*k,c[2]*k];
  const H=(i,k)=>34+(3*k+i)*19.5;
  const angs=[PI,PI/3,-PI/3];
  for(let i=0;i<3;i++){const ang=angs[i],dx=Math.sin(ang),dz=Math.cos(ang);
    for(let k=0;k<9;k++){const y0=k===0?0:H(i,k-1),y1=H(i,k),L=60-5.2*k,w=11-.5*k;
      const tint=k===0?warm:cool;
      prism(A,wingPts(ang,9,L,w),y0,y1,mul(tint,.92),mul(cool,.24),true);
      const ym=y0+(y1-y0)*.52;
      prism(A,wingPts(ang,L-w-2,L+2.7,w-2.6),y0,ym,mul(tint,1.05),mul(cool,.3),true);
      prism(B,wingPts(ang,9,L+.25,w+.25),y1-.45,y1+.35,bandC,bandC,true,bandC);
      prism(B,wingPts(ang,L-w-2,L+2.9,w-2.4),ym-.3,ym+.3,bandC,bandC,true,bandC);
      const tx=dx*(L+.3),tz=dz*(L+.3);
      prism(B,[[tx-.28,tz-.28],[tx+.28,tz-.28],[tx+.28,tz+.28],[tx-.28,tz+.28]],ym,y1,finC,mul(finC,.35),false);
      glints.push(dx*L,y1+1,dz*L, dx*(L+2.7),ym+1,dz*(L+2.7));
      const px=dz,pz=-dx;glints.push(dx*(L-w)+px*w,y1+1,dz*(L-w)+pz*w, dx*(L-w)-px*w,y1+1,dz*(L-w)-pz*w);
    }}
  for(let y=0;y<600;y+=40)prism(A,ngon(16,12),y,Math.min(600,y+40),mul(cool,.8),mul(cool,.22),y+40>=600);
  const stages=[[12.5,600,650],[9.5,650,700],[6.5,700,740]];
  for(const s of stages){prism(A,ngon(s[0],12),s[1],s[2],mul(cool,1.0),mul(cool,.28),true);
    prism(B,ngon(s[0]+.25,12),s[2]-.5,s[2]+.4,bandC,bandC,true,bandC);
    for(let i=0;i<6;i++){const a=i/6*TAU;glints.push(Math.sin(a)*s[0],s[2]+1,Math.cos(a)*s[0]);}}
  prism(B,ngon(16.25,12),599.5,600.4,bandC,bandC,true,bandC);
  for(let i=0;i<6;i++){const a=i/6*TAU;glints.push(Math.sin(a)*16,601,Math.cos(a)*16);}

  const facade=ctex(256,256,(g,w,h)=>{
    g.fillStyle='#0b1220';g.fillRect(0,0,w,h);
    const cols=8,rows=3,cw=w/cols,ch=h/rows;
    for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){
      const v=R();let col;
      if(v<.13)col=`rgb(${255},${rr(205,235)|0},${rr(150,190)|0})`;
      else if(v<.2)col=`rgb(${rr(190,220)|0},${rr(225,240)|0},255)`;
      else{const b=rr(.35,1);col=`rgb(${20+30*b|0},${34+50*b|0},${62+80*b|0})`;}
      g.fillStyle=col;g.fillRect(c*cw+2,r*ch+10,cw-4,ch-14);
      const gr=g.createLinearGradient(0,r*ch+10,0,r*ch+ch);gr.addColorStop(0,'rgba(255,255,255,.14)');gr.addColorStop(.5,'rgba(255,255,255,0)');
      g.fillStyle=gr;g.fillRect(c*cw+2,r*ch+10,cw-4,ch-14);
    }
    g.fillStyle='#7f96bd';for(let c=0;c<=cols;c++)g.fillRect(c*cw-1,0,2,h);
    g.fillStyle='#060a12';g.fillRect(0,0,12,12);
  },[1,1]);
  const gA=new T.BufferGeometry();
  gA.setAttribute('position',new T.Float32BufferAttribute(A.pos,3));
  gA.setAttribute('uv',new T.Float32BufferAttribute(A.uv,2));
  gA.setAttribute('color',new T.Float32BufferAttribute(A.col,3));
  const mA=new T.MeshBasicMaterial({map:facade,vertexColors:true});
  mA.onBeforeCompile=sh=>{sh.uniforms.uTime=uTime;
    sh.vertexShader=sh.vertexShader.replace('#include <common>','#include <common>\nvarying float vH;').replace('#include <begin_vertex>','#include <begin_vertex>\nvH=position.y;');
    sh.fragmentShader=sh.fragmentShader.replace('#include <common>','#include <common>\nvarying float vH;\nuniform float uTime;')
      .replace('#include <tonemapping_fragment>','float bb=fract(vH/760.0-uTime*0.05);\nfloat band=smoothstep(0.0,0.07,bb)*smoothstep(0.2,0.07,bb);\ngl_FragColor.rgb+=gl_FragColor.rgb*band*1.5+vec3(0.015,0.03,0.07)*band;\n#include <tonemapping_fragment>');};
  const tm=new T.Mesh(gA,mA);tm.frustumCulled=false;tower.add(tm);
  const gB=new T.BufferGeometry();
  gB.setAttribute('position',new T.Float32BufferAttribute(B.pos,3));
  gB.setAttribute('color',new T.Float32BufferAttribute(B.col,3));
  const bm=new T.Mesh(gB,new T.MeshBasicMaterial({vertexColors:true}));bm.frustumCulled=false;tower.add(bm);
  const sg=new T.CylinderGeometry(.3,4.4,88,10,6);const sp=sg.attributes.position,sc=[];
  for(let i=0;i<sp.count;i++){const t=(sp.getY(i)+44)/88,k=.55+.9*Math.abs(Math.sin(t*9));sc.push(.75*k,.85*k,1*k);}
  sg.setAttribute('color',new T.Float32BufferAttribute(sc,3));
  mesh(sg,new T.MeshBasicMaterial({vertexColors:true}),0,784,0,tower);
  tower.add(points(glints,0xfff0d0,7,{opacity:.95}));
  const beacon=new T.Sprite(new T.SpriteMaterial({map:glowTex,color:0xffffff,transparent:true,depthWrite:false,blending:T.AdditiveBlending,fog:false}));
  beacon.position.set(0,829,0);beacon.scale.set(46,46,1);scene.add(beacon);tower.userData.beacon=beacon;
})();

/* ---------- CITY ---------- */

function lobbyOK(x,z){if(!(Math.abs(x)<11.4&&z>14.6&&z<45.4))return false;for(const c of COLS)if(Math.hypot(x-c[0],z-c[1])<1.15)return false;

  if(Math.abs(x)<12.7&&z>12&&z<46.9)return false;if(Math.hypot(x,z-FZ)<20.3)return false;return true;}
function allowed(x,z){
  if(elev.state==='moving'||elev.state==='closing'||elev.state==='opening')return cabinOK(x,z);

  if(tMove<10&&now-tStart<320){if(now-lastTap<380&&document.body.classList.contains('clean'))setClean(false);else tap(t.clientX,t.clientY);lastTap=now;}}}}
canvas.addEventListener('touchend',tEnd);canvas.addEventListener('touchcancel',tEnd);
const ray=new T.Raycaster(),nd=new T.Vector2();
function tap(x,y){if(!started||tour.on)return;nd.set(x/innerWidth*2-1,-(y/innerHeight)*2+1);ray.setFromCamera(nd,camera);const h=ray.intersectObject(btnMesh);if(h.length&&h[0].distance<5)pressElevator();}
/* joystick */
const joy=$('joy'),knob=$('knob');let joyId=null;
function joySet(t){const r=joy.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;let dx=t.clientX-cx,dy=t.clientY-cy;const m=Math.hypot(dx,dy),mx=44;if(m>mx){dx*=mx/m;dy*=mx/m;}
  knob.style.transform=`translate(${dx}px,${dy}px)`;joyX=dx/mx;joyY=dy/mx;}
joy.addEventListener('touchstart',e=>{e.preventDefault();e.stopPropagation();const t=e.changedTouches[0];joyId=t.identifier;joySet(t);},{passive:false});
joy.addEventListener('touchmove',e=>{e.preventDefault();for(const t of e.changedTouches)if(t.identifier===joyId)joySet(t);},{passive:false});
function jEnd(e){for(const t of e.changedTouches)if(t.identifier===joyId){joyId=null;joyX=joyY=0;knob.style.transform='';}}
joy.addEventListener('touchend',jEnd);joy.addEventListener('touchcancel',jEnd);

/* ---------- UI ---------- */
let toastT=0;
function toast(msg,ms){const t=$('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),ms||2600);}
function setClean(v){document.body.classList.toggle('clean',v);if(v)toast(isTouch?'انقر مرتين على الشاشة لإظهار الأزرار':'اضغط H أو انقر مرتين لإظهار الأزرار',2600);}
$('btnHide').addEventListener('click',()=>setClean(true));
$('btnShow').addEventListener('click',()=>{lake.start(0);toast('بدأ عرض النافورة في البحيرة',1800);});
$('btnTour').addEventListener('click',()=>{tour.on?stopTour():startTour();});
$('btnAct').addEventListener('click',()=>pressElevator());
$('hint').textContent=isTouch?'الجويستك للمشي · اسحب على الشاشة للنظر':'WASD أو الأسهم للمشي · الماوس للنظر · Shift للركض · E للمصعد · H لإخفاء الأزرار';
$('introTip').innerHTML=isTouch?'الجويستك للمشي · اسحب على الشاشة للنظر حولك<br>ادخل من الباب الرئيسي ثم اصعد بالمصعد إلى الطابق 148':'WASD أو الأسهم للمشي · حرّك الماوس للنظر<br>ادخل من الباب الرئيسي ثم اصعد بالمصعد إلى الطابق 148';
function begin(withTour){started=true;document.body.classList.remove('pre');$('intro').classList.add('gone');if(withTour)startTour();else{$('fade').classList.add('on');setTimeout(()=>{idle=false;$('fade').classList.remove('on');},620);}}
$('goWalk').addEventListener('click',()=>begin(false));
$('goTour').addEventListener('click',()=>{begin(true);setTimeout(()=>{idle=false;},620);});
let idle=true;
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>signRedraw.forEach(f=>f()));

function resize(){const w=innerWidth,h=innerHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.fov=w<h?80:66;camera.updateProjectionMatrix();}
addEventListener('resize',resize);addEventListener('orientationchange',()=>setTimeout(resize,250));resize();

/* ---------- LOOP ---------- */
const clock=new T.Clock();let time=0,fAcc=0,fN=0,placeTxt='',actTxt='',floorShow=false,floorHold=0,lastFloor=-1;
function frame(){
  requestAnimationFrame(frame);
  const raw=clock.getDelta(),dt=Math.min(raw,.05);time+=dt;
  fAcc+=raw;fN++;if(fN>=50){const avg=fAcc/fN;fAcc=0;fN=0;if(avg>.027&&PR>.85&&time>4){PR=Math.max(.85,PR-.25);renderer.setPixelRatio(PR);resize();}}

  if(idle){const a=time*.05+.5;camera.position.set(Math.sin(a)*120,7+Math.sin(time*.1)*3,Math.cos(a)*120+10);camera.lookAt(0,isTouch||innerWidth<innerHeight?250:170,0);}
  else if(tour.on){updateTour(dt);}
  else{
    let f=0,s=0;if(keys.KeyW||keys.ArrowUp)f+=1;if(keys.KeyS||keys.ArrowDown)f-=1;if(keys.KeyD)s+=1;if(keys.KeyA)s-=1;
    if(keys.ArrowLeft)player.yaw+=dt*1.7;if(keys.ArrowRight)player.yaw-=dt*1.7;
    f-=joyY;s+=joyX;const m=Math.hypot(f,s);if(m>1){f/=m;s/=m;}
    const inside=player.top||elev.state!=='idle'||!outsideOK(player.x,player.z);
    const run=keys.ShiftLeft||keys.ShiftRight;const sp=inside?(run?7.5:4.2):(run?17:8.5);
    if(m>.02){const sn=Math.sin(player.yaw),cs=Math.cos(player.yaw);
      const dx=(-sn*f+cs*s)*sp*dt,dz=(-cs*f-sn*s)*sp*dt;
      const stuck=!allowed(player.x,player.z);
      if(stuck||allowed(player.x+dx,player.z))player.x+=dx;
      if(stuck||allowed(player.x,player.z+dz))player.z+=dz;
      player.bob+=dt*sp*1.5;}
    const baseY=(elev.state!=='idle'&&cabinOK(player.x,player.z))?elev.y:(player.top?DECK_Y:0);
    const shake=elev.state==='moving'?Math.sin(time*37)*.004:0;
    camera.position.set(player.x,baseY+EYE+Math.sin(player.bob)*.035*Math.min(1,m)+shake,player.z);
    camera.rotation.set(player.pitch,player.yaw,0);
  }
  const cx=camera.position.x,cy=camera.position.y,cz=camera.position.z;
  updateElevator(dt,cx,cy,cz);
  if(!idle&&!tour.on&&elev.state!=='idle'&&cabinOK(player.x,player.z))camera.position.y=elev.y+EYE;

  const inFoot=Math.abs(cx)<12&&cz>7.5&&cz<46;
  tower.visible=!(cy<545&&inFoot);
  const topSide=cy>300;
  if(topSide)innerL.position.set(0,DECK_Y+3.4,0);else innerL.position.set(0,6.4,30);
  innerL.intensity=topSide?1.9:1.15;
  innerL.distance=topSide?70:60;

  uTime.value=time;fUpdate(time);lakeUpdate(time,dt);
  carTex.offset.x=time*.012;
  redBeacons.material.opacity=.35+.65*Math.max(0,Math.sin(time*2.2));
  const b=tower.userData.beacon;const pulse=Math.pow(Math.max(0,Math.sin(time*1.8)),8);b.scale.setScalar(34+pulse*70);b.material.opacity=.55+.45*pulse;

  /* hud */
  let p;const inCab=Math.abs(cx)<2.6&&cz>7.9&&cz<14;
  if(inCab)p='المصعد';else if(topSide)p='منصة المشاهدة · الطابق 148';else if(inFoot)p='اللوبي';else p=cz>152?'بحيرة النافورة':'الساحة الخارجية';
  if(idle)p='';
  if(p!==placeTxt){placeTxt=p;$('place').textContent=p;}
  let a='';if(!tour.on&&!idle&&elev.state==='idle'&&cabinOK(player.x,player.z)&&elev.atTop===player.top)a=elev.atTop?'انزل إلى اللوبي':'اصعد إلى الطابق 148';
  if(a!==actTxt){actTxt=a;const bt=$('btnAct');bt.textContent=a;bt.classList.toggle('show',!!a);}
  if(elev.state==='moving'||elev.state==='closing')floorHold=2.2;else floorHold-=dt;
  const fs=floorHold>0&&inCab;if(fs!==floorShow){floorShow=fs;$('floor').classList.toggle('show',fs);}
  if(elev.floor!==lastFloor){lastFloor=elev.floor;$('floorNum').textContent=elev.floor;}

  lakeReflect(time,tower.visible&&!topSide);
  renderer.render(scene,camera);
}
window.__bk={lake,dbg:{},player,elev,tour,camera,startTour,stopTour,pressElevator,begin,setIdle:v=>{idle=v;},scene,renderer};
frame();
})();
</script>
